[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octobrowser-api"
version = "0.3.1"
description = "Fully-typed, sync + async Python SDK for the Octo Browser automation API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "lordsinactive" }]
keywords = [
    "octobrowser",
    "octo browser",
    "anti-detect",
    "antidetect",
    "browser automation",
    "fingerprint",
    "profiles",
    "sdk",
    "async",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/lordsinactive/octobrowser"
Repository = "https://github.com/lordsinactive/octobrowser"
Issues = "https://github.com/lordsinactive/octobrowser/issues"
"Octo Browser API" = "https://octobrowser.net/api"

[tool.hatch.build.targets.wheel]
packages = ["octobrowser_api"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
